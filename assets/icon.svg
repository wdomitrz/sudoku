<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sudoku">
  <!-- The icon: a sudoku grid, sized the way the bot's own icon is sized.

       The drawing sits inside the maskable safe zone. Android crops an
       installed app's icon with whatever mask the launcher uses — a circle, a
       squircle, a rounded square — and only the middle 80% of the image is
       guaranteed to survive it, so anything drawn up to the edges loses its
       edges. The first version of this file filled 78% of the canvas and read
       as too big on Android for exactly that reason. The glyph below is 320 of
       512 — 62.5%, the proportion the bot icon uses — which leaves room for the
       mask, for the launcher's own padding, and for the icon to look deliberate
       rather than clipped.

       One colour, on a transparent ground, at the measured midpoint between a
       light and a dark surface: a single static icon cannot clear 4.5:1 on both
       (#7a7a7a is 4.29:1 on white and 4.40:1 on the app's own dark ground), and
       3:1 is the bar for a graphical object. Every install icon is rasterized
       from this file at build time; this is the source of truth, never a PNG. -->
  <g fill="none" stroke="#7a7a7a" stroke-linecap="round">
    <!-- The outer grid: 320 wide, centred in 512, so 96 to 416. -->
    <rect x="96" y="96" width="320" height="320" rx="26" stroke-width="24"/>
    <!-- The 3×3 box rules, at a third and two thirds of the way across. -->
    <path d="M202.67 96v320M309.33 96v320M96 202.67h320M96 309.33h320" stroke-width="14"/>
  </g>
  <!-- Four placed cells: a puzzle part-way through, which is what a sudoku in
       progress looks like at a glance, and the only thing that distinguishes it
       from a spreadsheet at launcher size. -->
  <g fill="#7a7a7a">
    <rect x="118" y="118" width="60" height="60" rx="10"/>
    <rect x="334" y="118" width="60" height="60" rx="10"/>
    <rect x="118" y="334" width="60" height="60" rx="10"/>
    <rect x="226" y="226" width="60" height="60" rx="10"/>
  </g>
</svg>
